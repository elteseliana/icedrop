<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 150" role="img" aria-label="Cartoon ice machine">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9f2ff"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#b6e3ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa9f5"/><stop offset="1" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f8ff"/><stop offset="1" stop-color="#8fd6ff"/>
    </linearGradient>
  </defs>
  <rect x="20" y="4" width="180" height="100" rx="22" fill="url(#body)" stroke="#2a8fd8" stroke-width="4"/>
  <rect x="36" y="18" width="92" height="56" rx="14" fill="url(#glass)" stroke="#2a8fd8" stroke-width="3"/>
  <g fill="#fff" stroke="#5cc0ff" stroke-width="2">
    <rect x="46" y="44" width="18" height="18" rx="4" transform="rotate(-10 55 53)"/>
    <rect x="70" y="48" width="18" height="18" rx="4" transform="rotate(14 79 57)"/>
    <rect x="94" y="42" width="18" height="18" rx="4" transform="rotate(-4 103 51)"/>
    <rect x="80" y="28" width="16" height="16" rx="4" transform="rotate(22 88 36)"/>
  </g>
  <path d="M44 26 Q60 20 76 24" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/>
  <rect x="140" y="18" width="46" height="56" rx="12" fill="url(#panel)"/>
  <circle cx="163" cy="36" r="9" fill="#ff6fa8" stroke="#fff" stroke-width="3"/>
  <circle cx="153" cy="60" r="5" fill="#b6ffe0"/><circle cx="173" cy="60" r="5" fill="#fff59d"/>
  <text x="110" y="96" font-family="Fredoka, Arial, sans-serif" font-size="15" font-weight="700" fill="#1565c0" text-anchor="middle">ICE DROP</text>
  <!-- chute -->
  <path d="M84 104 L136 104 L128 136 L92 136 Z" fill="url(#panel)" stroke="#0d47a1" stroke-width="3" stroke-linejoin="round"/>
  <rect x="88" y="132" width="44" height="10" rx="5" fill="#0d47a1"/>
  <!-- feet / frost -->
  <circle cx="28" cy="16" r="3" fill="#fff"/><circle cx="192" cy="96" r="3" fill="#fff"/>
</svg>
