<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" role="img" aria-label="Cute ice machine">
  <defs>
    <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#c9d6e2"/><stop offset=".35" stop-color="#f7fbff"/><stop offset=".7" stop-color="#dfe8f1"/><stop offset="1" stop-color="#aebfcf"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2a3a"/><stop offset="1" stop-color="#0b1520"/></linearGradient>
    <linearGradient id="chute" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5bc0eb"/><stop offset="1" stop-color="#1e90d6"/></linearGradient>
  </defs>
  <rect x="18" y="4" width="184" height="104" rx="18" fill="url(#metal)" stroke="#7d93a8" stroke-width="3"/>
  <rect x="26" y="10" width="168" height="8" rx="4" fill="#ffffff" opacity=".7"/>
  <!-- face screen -->
  <rect x="62" y="24" width="96" height="50" rx="12" fill="url(#screen)" stroke="#7d93a8" stroke-width="3"/>
  <path d="M82 46 q8 -10 16 0" stroke="#e9f8ff" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M122 46 q8 -10 16 0" stroke="#e9f8ff" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M100 54 q10 10 20 0" stroke="#e9f8ff" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="80" cy="58" rx="6" ry="3.5" fill="#ff9fb8" opacity=".85"/>
  <ellipse cx="140" cy="58" rx="6" ry="3.5" fill="#ff9fb8" opacity=".85"/>
  <!-- buttons -->
  <circle cx="178" cy="36" r="7" fill="#5bc0eb" stroke="#1e90d6" stroke-width="2.5"/>
  <circle cx="178" cy="58" r="7" fill="#5bc0eb" stroke="#1e90d6" stroke-width="2.5"/>
  <!-- vents -->
  <g stroke="#8ea3b7" stroke-width="3" stroke-linecap="round"><path d="M32 36 h16 M32 46 h16 M32 56 h16 M32 66 h16"/></g>
  <text x="110" y="96" font-family="Fredoka, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b3d66" text-anchor="middle" letter-spacing="2">ICE DROP</text>
  <!-- chute -->
  <path d="M82 108 L138 108 L130 142 L90 142 Z" fill="url(#chute)" stroke="#0b3d66" stroke-width="3" stroke-linejoin="round"/>
  <rect x="86" y="138" width="48" height="10" rx="5" fill="#0b3d66"/>
</svg>
