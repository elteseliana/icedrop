<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Ice Drop logo">
  <defs>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfe9ff"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd6ff"/>
      <stop offset="1" stop-color="#3fa9f5"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc0ff"/>
      <stop offset="1" stop-color="#1e88e5"/>
    </linearGradient>
    <radialGradient id="frost" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8f7ff"/>
      <stop offset="1" stop-color="#9edcff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- motion lines -->
  <g stroke="#7fcfff" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="44" y1="6" x2="44" y2="20"/>
    <line x1="60" y1="2" x2="60" y2="16"/>
    <line x1="76" y1="6" x2="76" y2="20"/>
  </g>
  <!-- frost splash -->
  <ellipse cx="60" cy="104" rx="46" ry="11" fill="url(#frost)"/>
  <g fill="#bfe9ff" stroke="#5cc0ff" stroke-width="1.5" stroke-linejoin="round">
    <path d="M22 104 l-10 -12 l14 6 z"/>
    <path d="M98 104 l10 -12 l-14 6 z"/>
    <path d="M34 98 l-6 -16 l12 10 z"/>
    <path d="M86 98 l6 -16 l-12 10 z"/>
  </g>
  <g fill="#ffffff">
    <circle cx="16" cy="84" r="2.5"/><circle cx="104" cy="82" r="2.5"/>
    <circle cx="26" cy="74" r="1.8"/><circle cx="95" cy="72" r="1.8"/>
  </g>
  <!-- glossy cube, slightly tilted -->
  <g transform="rotate(-12 60 62)">
    <path d="M60 26 L92 42 L60 58 L28 42 Z" fill="url(#cubeTop)" stroke="#2a8fd8" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M28 42 L60 58 L60 96 L28 80 Z" fill="url(#cubeLeft)" stroke="#2a8fd8" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M92 42 L60 58 L60 96 L92 80 Z" fill="url(#cubeRight)" stroke="#2a8fd8" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- shiny highlights -->
    <path d="M44 38 Q56 32 70 36" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M34 50 L34 70" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <circle cx="34" cy="76" r="2.2" fill="#fff" opacity="0.9"/>
    <path d="M84 52 L84 62" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
