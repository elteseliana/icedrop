<!doctype html>
<!--
  🧊 ICE DROP — main page.
  Most words are NOT here. They live in js/texts.js (English + Hebrew).
  Prices, times and phone numbers live in js/config.js.
  Elements with data-t="someKey" get their words from texts.js.
-->
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ice Drop — משלוח קרח עד הדלת ברעננה</title>
  <meta name="description" content="Ice Drop: cold ice delivered to your door in Ra'anana every Friday. משלוח קרח עד הדלת ברעננה בכל יום שישי.">
  <meta name="theme-color" content="#3fa9f5">
  <meta property="og:title" content="Ice Drop 🧊">
  <meta property="og:description" content="Ra'anana is hot. Your freezer is empty. We've got you. 🧊">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Leaflet map (free, no API key) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#order" data-t="skipToForm">Skip to order form</a>

  <!-- ===== Ice machine + ice rain (decoration only) ===== -->
  <div id="ice-machine" class="ice-machine" aria-hidden="true">
    <img src="assets/ice-machine.svg" alt="" width="220" height="150">
  </div>
  <canvas id="ice-rain" class="ice-rain" aria-hidden="true"></canvas>

  <!-- ===== Header ===== -->
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="#top" class="logo" aria-label="Ice Drop">
        <img src="assets/logo.svg" alt="" width="44" height="44">
        <span class="brand" dir="ltr" lang="en">Ice Drop</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#why" data-t="navWhy">Why us</a>
        <a href="#prices" data-t="navPrices">Prices</a>
        <a href="#area" data-t="navArea">Area</a>
        <a href="#order" data-t="navOrder">Order</a>
      </nav>
      <div class="header-actions">
        <button type="button" id="music-btn" class="chip chip-music" aria-expanded="false" aria-controls="music-panel">
          <span data-t="musicBtn">🎵 Ice Ice Baby</span>
        </button>
        <button type="button" id="lang-btn" class="chip chip-lang" lang="en" data-t-label="langToggleLabel">
          <span data-t="langToggle">English</span>
        </button>
      </div>
    </div>
    <!-- Spotify player: hidden until the music button is tapped -->
    <div id="music-panel" class="music-panel" hidden>
      <div class="wrap music-inner">
        <div id="music-frame-holder" class="music-frame"></div>
        <button type="button" id="music-close" class="music-close" data-t-label="musicClose">✕</button>
      </div>
    </div>
  </header>

  <main id="top">
    <!-- ===== Hero ===== -->
    <section class="hero">
      <div class="wrap hero-inner">
        <p class="kicker" data-t="heroKicker"></p>
        <h1 class="hero-title" data-t="heroTitle"></h1>
        <p class="hero-sub" data-t="heroSub"></p>
        <div class="hero-ctas">
          <a href="#order" class="btn btn-primary btn-big" data-t="heroCta">Order ice</a>
          <a href="#prices" class="btn btn-ghost" data-t="heroCta2">See prices</a>
        </div>
        <p class="hero-badge" data-t="heroBadge" data-vars="window"></p>
      </div>

      <!-- Skate-stop swoosh -->
      <div class="skate" aria-hidden="true">
        <svg class="skate-svg" viewBox="0 0 1000 120" preserveAspectRatio="none">
          <defs>
            <linearGradient id="swooshGrad" x1="0" x2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
              <stop offset="0.6" stop-color="#bfe9ff"/>
              <stop offset="1" stop-color="#ffffff"/>
            </linearGradient>
          </defs>
          <path class="skate-line" d="M -20 92 C 250 92, 520 70, 760 78" />
          <path class="skate-line skate-line-2" d="M -20 102 C 260 100, 520 84, 750 88" />
        </svg>
        <div class="skate-cube"><img src="assets/logo.svg" alt="" width="56" height="56"></div>
        <div class="skate-spray"></div>
      </div>
      <div class="hero-snowbank" aria-hidden="true"></div>
    </section>

    <!-- ===== Story ===== -->
    <section class="section story" id="story">
      <div class="wrap">
        <h2 class="section-title" data-t="storyTitle"></h2>
        <ol class="story-list">
          <li><span class="story-emoji" aria-hidden="true">☀️</span><p data-t="story1"></p></li>
          <li><span class="story-emoji" aria-hidden="true">🧊</span><p data-t="story2"></p></li>
          <li><span class="story-emoji" aria-hidden="true">🛒</span><p data-t="story3"></p></li>
          <li><span class="story-emoji" aria-hidden="true">🚪</span><p data-t="story4"></p></li>
        </ol>
      </div>
    </section>

    <!-- ===== Why us ===== -->
    <section class="section why" id="why">
      <div class="wrap">
        <h2 class="section-title" data-t="whyTitle"></h2>
        <div class="why-grid">
          <article class="why-card">
            <svg class="why-icon" viewBox="0 0 96 96" aria-hidden="true">
              <defs>
                <linearGradient id="fridge" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cdeeff"/></linearGradient>
                <linearGradient id="cubeG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#7fcfff"/></linearGradient>
              </defs>
              <rect x="22" y="8" width="52" height="80" rx="10" fill="url(#fridge)" stroke="#2a8fd8" stroke-width="3"/>
              <line x1="22" y1="38" x2="74" y2="38" stroke="#2a8fd8" stroke-width="3"/>
              <rect x="64" y="16" width="4" height="14" rx="2" fill="#2a8fd8"/>
              <rect x="64" y="46" width="4" height="18" rx="2" fill="#2a8fd8"/>
              <g transform="rotate(-14 52 66)">
                <rect x="40" y="54" width="26" height="26" rx="6" fill="url(#cubeG)" stroke="#2a8fd8" stroke-width="2.5"/>
                <path d="M45 60 L54 58" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
              </g>
              <circle cx="80" cy="20" r="12" fill="#ff6fa8"/>
              <path d="M75 20 l4 4 l7 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <h3 data-t="why1Title"></h3>
            <p data-t="why1Text"></p>
          </article>
          <article class="why-card">
            <svg class="why-icon" viewBox="0 0 96 96" aria-hidden="true">
              <defs>
                <linearGradient id="bagG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd6e7"/><stop offset="1" stop-color="#ff8fbf"/></linearGradient>
              </defs>
              <path d="M24 34 h48 l-5 50 h-38 z" fill="url(#bagG)" stroke="#d6457f" stroke-width="3" stroke-linejoin="round"/>
              <path d="M36 34 v-8 a12 12 0 0 1 24 0 v8" fill="none" stroke="#d6457f" stroke-width="3"/>
              <path d="M30 46 l4 30" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
              <circle cx="48" cy="56" r="34" fill="none" stroke="#1e88e5" stroke-width="6"/>
              <line x1="24" y1="80" x2="72" y2="32" stroke="#1e88e5" stroke-width="6" stroke-linecap="round"/>
            </svg>
            <h3 data-t="why2Title"></h3>
            <p data-t="why2Text"></p>
          </article>
          <article class="why-card">
            <svg class="why-icon" viewBox="0 0 96 96" aria-hidden="true">
              <defs>
                <linearGradient id="doorG" x1="0" x2="1"><stop offset="0" stop-color="#5cc0ff"/><stop offset="1" stop-color="#1e88e5"/></linearGradient>
                <linearGradient id="iceBag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bfe9ff"/></linearGradient>
              </defs>
              <rect x="14" y="8" width="44" height="80" rx="6" fill="url(#doorG)" stroke="#0d47a1" stroke-width="3"/>
              <circle cx="50" cy="50" r="3.5" fill="#fff59d"/>
              <rect x="22" y="16" width="28" height="22" rx="4" fill="#bfe9ff" opacity="0.6"/>
              <path d="M54 50 q14 -6 28 0 l-3 36 h-22 z" fill="url(#iceBag)" stroke="#2a8fd8" stroke-width="3" stroke-linejoin="round"/>
              <rect x="60" y="60" width="9" height="9" rx="2" fill="#9edcff"/>
              <rect x="70" y="68" width="9" height="9" rx="2" fill="#9edcff"/>
              <rect x="61" y="73" width="8" height="8" rx="2" fill="#9edcff"/>
              <path d="M84 30 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z" fill="#fff" stroke="#5cc0ff" stroke-width="1.5"/>
            </svg>
            <h3 data-t="why3Title"></h3>
            <p data-t="why3Text"></p>
          </article>
        </div>
      </div>
    </section>

    <!-- ===== Prices ===== -->
    <section class="section prices" id="prices">
      <div class="wrap">
        <h2 class="section-title" data-t="pricesTitle"></h2>
        <p class="section-sub" data-t="pricesSub"></p>
        <!-- Built automatically from js/config.js -->
        <div class="price-hero">
          <div class="price-tag">
            <span class="price-tag-amount" dir="ltr" id="price-per-kg"></span>
            <span class="price-tag-unit" data-t="perKg"></span>
          </div>
          <div class="price-examples" id="price-examples"></div>
          <p class="free-badge" data-t="deliveryRule"></p>
        </div>

        <div class="info-grid">
          <div class="info-card">
            <h3 data-t="deliveryInfoTitle"></h3>
            <p data-t="deliveryInfoDay" data-vars="window"></p>
            <p data-t="deliveryInfoCutoff"></p>
            <p class="next-date" data-t="deliveryInfoNext" data-vars="date"></p>
          </div>
          <div class="info-card">
            <h3 data-t="weeklyInfoTitle"></h3>
            <p data-t="weeklyInfoText"></p>
            <a class="btn btn-wa js-pause-link" target="_blank" rel="noopener" data-t="pauseBtn" href="#"></a>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== Delivery area ===== -->
    <section class="section area" id="area">
      <div class="wrap">
        <h2 class="section-title" data-t="areaTitle"></h2>
        <p class="section-sub" data-t="areaSub"></p>
        <div id="map" class="map" role="img" data-t-label="mapLabel"></div>
        <p class="area-note" data-t="areaNote"></p>
      </div>
    </section>

    <!-- ===== Order form ===== -->
    <section class="section order" id="order">
      <div class="wrap wrap-narrow">
        <div id="order-form-wrap">
          <h2 class="section-title" data-t="orderTitle"></h2>
          <form id="order-form" class="order-card" novalidate>
            <p class="order-when" data-t="orderWhen"></p>
            <p id="form-error" class="form-error" role="alert" hidden></p>

            <!-- Honeypot: hidden from people, bots fill it in -->
            <div class="hp" aria-hidden="true">
              <label>Leave empty <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
            </div>

            <div class="row-2">
              <div class="field">
                <label for="f-name" data-t="fName"></label>
                <input id="f-name" name="name" type="text" autocomplete="name" required maxlength="80" data-ph="fNamePh">
                <p class="err" id="err-name"></p>
              </div>
              <div class="field">
                <label for="f-phone" data-t="fPhone"></label>
                <input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required maxlength="20" dir="ltr" data-ph="fPhonePh">
                <p class="err" id="err-phone"></p>
              </div>
            </div>

            <div class="field">
              <label for="f-street" data-t="fStreet"></label>
              <input id="f-street" name="street" type="text" autocomplete="street-address" required maxlength="120" data-ph="fStreetPh">
              <p class="err" id="err-street"></p>
              <div class="row-3">
                <input id="f-apt" name="apt" type="text" maxlength="10" inputmode="numeric" data-ph="fApt" data-t-label="fApt">
                <input id="f-floor" name="floor" type="text" maxlength="10" inputmode="numeric" data-ph="fFloor" data-t-label="fFloor">
                <input id="f-code" name="code" type="text" maxlength="20" data-ph="fCode" data-t-label="fCode">
              </div>
            </div>

            <div class="field">
              <label for="f-kg" data-t="fKg"></label>
              <div class="select-wrap">
                <select id="f-kg" name="kg"></select>
              </div>
              <p class="nudge" id="kg-nudge" aria-live="polite"></p>
            </div>

            <div class="field">
              <span class="label" id="lbl-type" data-t="fType"></span>
              <div class="seg" role="radiogroup" aria-labelledby="lbl-type">
                <label><input type="radio" name="orderType" value="once" checked><span data-t="typeOnce"></span></label>
                <label><input type="radio" name="orderType" value="weekly"><span data-t="typeWeekly"></span></label>
              </div>
            </div>

            <div class="field">
              <span class="label" id="lbl-pay" data-t="fsPay"></span>
              <div class="seg" role="radiogroup" aria-labelledby="lbl-pay">
                <label><input type="radio" name="payment" value="bit"><span>📱 <span data-t="payBit"></span></span></label>
                <label><input type="radio" name="payment" value="cash"><span>💵 <span data-t="payCash"></span></span></label>
              </div>
              <p class="err" id="err-payment"></p>

              <div id="bit-box" class="pay-box" hidden>
                <p data-t="bitBoxText"></p>
                <div class="bit-row">
                  <span class="bit-num js-bit-number" dir="ltr"></span>
                  <button type="button" class="btn btn-small js-copy-bit" data-t="bitCopy"></button>
                  <a class="btn btn-small btn-bit js-bit-pay" href="#" target="_blank" rel="noopener" data-t="bitPayBtn"></a>
                </div>
                <p class="bit-toast" role="status" aria-live="polite"></p>
              </div>
              <p id="cash-box" class="pay-note" hidden data-t="cashBoxText"></p>
            </div>

            <details class="notes">
              <summary data-t="addNote"></summary>
              <textarea id="f-notes" name="notes" rows="2" maxlength="400" data-ph="fNotesPh" data-t-label="fNotes"></textarea>
            </details>

            <div class="total" aria-live="polite">
              <div class="total-lines">
                <span id="total-ice"></span>
                <span id="total-delivery"></span>
              </div>
              <div class="total-amount"><span id="total-amount" dir="ltr"></span><small id="total-weekly"></small></div>
            </div>

            <button type="submit" class="btn btn-primary btn-big btn-block" id="submit-btn" data-t="submit"></button>
            <p class="reminder-small" data-t="homeReminderShort" data-vars="window"></p>
          </form>
        </div>

        <!-- ===== Thank-you screen (shown after submitting) ===== -->
        <div id="thanks" class="thanks" hidden tabindex="-1">
          <img class="thanks-logo" src="assets/logo.svg" alt="" width="96" height="96">
          <h2 class="section-title" data-t="thanksTitle"></h2>
          <p class="thanks-text" data-t="thanksText"></p>

          <div class="summary">
            <h3 data-t="thanksSummary"></h3>
            <dl id="summary-list"></dl>
          </div>

          <p class="reminder" data-t="homeReminder" data-vars="window"></p>

          <a id="wa-order-btn" class="btn btn-wa btn-big btn-block" target="_blank" rel="noopener" href="#" data-t="waOrderBtn"></a>
          <p class="hint" data-t="waOrderHint"></p>

          <a id="thanks-pause" class="btn btn-wa-ghost btn-block js-pause-link" target="_blank" rel="noopener" href="#" data-t="pauseBtn" hidden></a>

          <button type="button" id="new-order" class="btn btn-ghost" data-t="newOrder"></button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div class="logo logo-footer">
        <img src="assets/logo.svg" alt="" width="40" height="40">
        <span class="brand" dir="ltr" lang="en">Ice Drop</span>
      </div>
      <p data-t="footerTag"></p>
      <a class="btn btn-wa js-wa-contact" target="_blank" rel="noopener" href="#">
        💬 <span data-t="footerContact"></span> · <span class="js-wa-number" dir="ltr"></span>
      </a>
      <p class="footer-small" data-t="footerMade"></p>
      <p class="footer-small">© <span id="year"></span> <span dir="ltr" lang="en">Ice Drop</span></p>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/config.js"></script>
  <script src="js/texts.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
