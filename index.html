<!doctype html>
<!--
  ICE DROP — main page.
  Words live in js/texts.js (English + Hebrew).
  Prices, delivery days and phone numbers live in the Google Sheet.
  Site-only settings (Sheet link, map, music) live in js/config.js.
  Elements with data-t="someKey" get their words from texts.js.
  Elements with data-reveal slide in when you scroll to them.
-->
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ice Drop</title>
  <meta name="description" content="Ice Drop: 30% more ice than the makolet, delivered to your door in Ra'anana, same price. 30% יותר קרח מהמכולת, עד הדלת ברעננה, באותו מחיר.">
  <meta name="theme-color" content="#061a2e">
  <meta property="og:title" content="Ice Drop">
  <meta property="og:description" content="More ice. Same price. At your door.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;600;700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">

  <!-- Leaflet map (free, no API key) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-gated">
  <!-- ===== Opening screen: the tap starts the music and the frost ===== -->
  <div id="gate" class="gate" role="dialog" aria-modal="true" aria-labelledby="gate-name">
    <button type="button" class="gate-lang" id="gate-lang" data-t="langToggle">English</button>
    <div class="gate-inner">
      <img src="assets/img/cube-hero.webp" alt="" class="gate-cube" width="552" height="502">
      <p class="gate-name" id="gate-name" dir="ltr" lang="en">ICE DROP</p>
      <button type="button" class="gate-btn" id="gate-btn">
        <span data-t="gateEnter">Tap to enter</span>
      </button>
      <p class="gate-sound">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <span data-t="gateSound">Sound on</span>
      </p>
    </div>
  </div>

  <a class="skip-link" href="#order" data-t="skipToForm">Skip to order form</a>

  <!-- music player: invisible, plays in the background -->
  <div id="music-panel" class="music-panel" aria-hidden="true">
    <div id="music-frame-holder" class="music-frame"><div id="yt-player"></div></div>
    <button type="button" id="music-close" class="music-close" tabindex="-1">✕</button>
  </div>

  <!-- ===== Animations (decoration only) ===== -->
  <div id="frost" class="frost" aria-hidden="true"><canvas id="frost-canvas"></canvas></div>
  <canvas id="ice-rain" class="ice-rain" aria-hidden="true"></canvas>

  <p id="demo-banner" class="demo-banner" data-t="demoBanner" hidden></p>

  <!-- ===== Header ===== -->
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="#top" class="logo" aria-label="Ice Drop" dir="ltr" lang="en">
        <img src="assets/logo.svg" alt="" width="34" height="34">
        <span class="logo-name">ICE DROP</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#story" data-t="navWhy">Why us</a>
        <a href="#prices" data-t="navPrices">Prices</a>
        <a href="#area" data-t="navArea">Area</a>
      </nav>
      <div class="header-actions">
        <button type="button" id="music-btn" class="chip chip-music" aria-pressed="false">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
          <span data-t="musicBtn">Ice Ice Baby</span>
        </button>
        <button type="button" id="lang-btn" class="chip chip-lang" lang="en" data-t-label="langToggleLabel">
          <span data-t="langToggle">English</span>
        </button>
        <a href="#order" class="chip chip-order" data-t="navOrder">Order</a>
      </div>
    </div>
  </header>

  <main id="top">
    <!-- ===== Hero ===== -->
    <section class="hero">
      <canvas id="hero-ice" class="hero-ice" aria-hidden="true"></canvas>
      <div class="wrap hero-grid">
        <div class="hero-text">
          <p class="eyebrow" data-t="heroKicker" data-reveal></p>
          <h1 class="hero-title" data-t="heroTitle" data-reveal></h1>
          <p class="hero-sub" data-t="heroSub" data-reveal></p>
          <div class="hero-ctas" data-reveal>
            <a href="#order" class="btn btn-ice btn-big" data-t="heroCta">Order ice</a>
            <a href="#prices" class="btn-link" data-t="heroCta2">See prices</a>
          </div>
          <p class="countdown js-countdown" hidden>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>
            <span class="js-countdown-text"></span>
          </p>
        </div>
        <div class="hero-visual" aria-hidden="true">
          <div class="hero-glow"></div>
          <div class="hero-cube-wrap" id="hero-cube"><img src="assets/img/cube-hero.webp" alt="" width="552" height="502" fetchpriority="high"></div>
        </div>
      </div>
      <a href="#math" class="scroll-hint" aria-hidden="true" tabindex="-1"><span></span></a>
    </section>

    <!-- ===== The math (scroll-driven) ===== -->
    <section class="math" id="math">
      <div class="math-sticky">
        <div class="wrap">
          <p class="eyebrow" data-t="mathEyebrow"></p>
          <h2 class="math-title" data-t="mathTitle"></h2>
          <div class="bars">
            <div class="bar-row">
              <span class="bar-label" data-t="cmpMakolet"></span>
              <div class="bar"><i class="bar-fill bar-them"></i></div>
              <span class="bar-val"><b class="js-mk-kg" dir="ltr"></b> <span data-t="kg"></span> · <span class="js-mk-price" dir="ltr"></span></span>
            </div>
            <div class="bar-row is-us">
              <span class="bar-label" dir="ltr" lang="en">Ice Drop</span>
              <div class="bar"><i class="bar-fill bar-us"></i></div>
              <span class="bar-val"><b class="js-our-kg-live" dir="ltr"></b> <span data-t="kg"></span> · <span class="js-our-price" dir="ltr"></span></span>
            </div>
          </div>
          <p class="math-foot" data-t="mathFoot"></p>
        </div>
      </div>
    </section>

    <!-- ===== Story panels ===== -->
    <section class="story" id="story">
      <div class="wrap">
        <article class="panel" data-reveal>
          <figure class="panel-img" data-parallax><img src="assets/img/ice-bag.jpg" alt="" width="511" height="501" loading="lazy"></figure>
          <div class="panel-text">
            <p class="eyebrow" data-t="fresh1Eyebrow"></p>
            <h2 class="panel-title" data-t="fresh1Title"></h2>
            <p data-t="fresh1Text"></p>
          </div>
        </article>
        <article class="panel panel-flip" data-reveal>
          <figure class="panel-img" data-parallax><img src="assets/img/ice-cubes.jpg" alt="" width="510" height="496" loading="lazy"></figure>
          <div class="panel-text">
            <p class="eyebrow" data-t="fresh2Eyebrow"></p>
            <h2 class="panel-title" data-t="fresh2Title"></h2>
            <p data-t="fresh2Text"></p>
          </div>
        </article>
      </div>
    </section>

    <!-- ===== Prices: a simple menu (built from the Sheet's Settings) ===== -->
    <section class="prices" id="prices">
      <div class="wrap">
        <div class="section-head" data-reveal>
          <p class="eyebrow" data-t="pricesEyebrow"></p>
          <h2 class="section-title" data-t="pricesTitle"></h2>
          <p class="section-sub" data-t="pricesSub"></p>
        </div>
        <ul id="price-list" class="price-list" data-reveal></ul>
      </div>
    </section>

    <!-- ===== Delivery area ===== -->
    <section class="area" id="area">
      <div class="wrap area-grid">
        <div class="section-head" data-reveal>
          <p class="eyebrow" data-t="areaEyebrow"></p>
          <h2 class="section-title" data-t="areaTitle"></h2>
          <p class="section-sub" data-t="areaSub"></p>
          <p class="area-note" data-t="areaNote"></p>
        </div>
        <div id="map" class="map" role="img" data-t-label="mapLabel" data-reveal></div>
      </div>
    </section>

    <!-- ===== Order ===== -->
    <section class="order" id="order">
      <div class="wrap wrap-narrow">
        <div id="order-form-wrap">
          <div class="section-head" data-reveal>
            <p class="eyebrow" data-t="orderEyebrow"></p>
            <h2 class="section-title" data-t="orderTitle"></h2>
          </div>
          <form id="order-form" class="order-card" novalidate>
            <p class="countdown countdown-bar js-countdown" hidden>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>
              <span class="js-countdown-text"></span>
            </p>
            <p id="form-error" class="form-error" role="alert" hidden></p>
            <div class="hp" aria-hidden="true">
              <label>Leave empty <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
            </div>

            <!-- The cooler fills up as you choose more ice -->
            <div class="cooler-stage" aria-hidden="true">
              <canvas id="cooler-canvas"></canvas>
              <div class="cooler-readout"><b id="kg-count" dir="ltr">0</b> <span data-t="kg"></span><small id="bags-count"></small></div>
            </div>

            <div class="field">
              <span class="label" id="lbl-ice" data-t="fIce"></span>
              <div id="ice-choices" class="ice-choices" role="radiogroup" aria-labelledby="lbl-ice"></div>
              <div id="upsell" class="upsell" hidden>
                <p class="js-upsell-text"></p>
                <button type="button" class="btn btn-small" id="upsell-btn" data-t="upsellBtn"></button>
              </div>
            </div>

            <div class="field">
              <span class="label" id="lbl-slot" data-t="fDay"></span>
              <div id="slot-list" class="slot-chips" role="radiogroup" aria-labelledby="lbl-slot" aria-live="polite"></div>
              <p class="err" id="err-slot"></p>
            </div>

            <div class="row-2">
              <div class="field">
                <label for="f-name" data-t="fName"></label>
                <input id="f-name" name="name" type="text" autocomplete="name" required maxlength="80" data-ph="fNamePh">
                <p class="err" id="err-name"></p>
              </div>
              <div class="field">
                <label for="f-phone" data-t="fPhone"></label>
                <input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required maxlength="20" dir="ltr" data-ph="fPhonePh">
                <p class="err" id="err-phone"></p>
              </div>
            </div>
            <div class="field">
              <label for="f-street" data-t="fStreet"></label>
              <input id="f-street" name="street" type="text" autocomplete="street-address" required maxlength="140" data-ph="fStreetPh">
              <p class="err" id="err-street"></p>
            </div>

            <div class="field">
              <div class="seg" role="radiogroup" aria-label="Payment">
                <label><input type="radio" name="payment" value="bit"><span data-t="payBit"></span></label>
                <label><input type="radio" name="payment" value="cash"><span data-t="payCash"></span></label>
              </div>
              <p class="err" id="err-payment"></p>
            </div>

            <details class="more">
              <summary data-t="moreOptions"></summary>
              <textarea id="f-notes" name="notes" rows="2" maxlength="300" data-ph="fNotesPh" data-t-label="fNotes"></textarea>
              <label class="check" id="own-cooler-wrap" hidden>
                <input type="checkbox" name="ownCooler" id="f-own-cooler">
                <span data-t="ownCooler"></span>
              </label>
            </details>

            <button type="submit" class="btn btn-primary btn-big btn-block" id="submit-btn">
              <span class="js-submit-label" data-t="submit"></span><span class="btn-total" id="btn-total" dir="ltr"></span>
            </button>
            <p class="savings-line" id="savings-line" aria-live="polite"></p>
          </form>
        </div>

        <!-- ===== Confirmation screen ===== -->
        <div id="thanks" class="thanks" hidden tabindex="-1">
          <div class="thanks-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
          <h2 class="section-title" id="thanks-title"></h2>
          <p class="thanks-text" data-t="thanksText"></p>
          <dl id="confirm-list" class="confirm-list"></dl>
          <div id="pay-bit" class="pay-box" hidden>
            <h3 data-t="payBitTitle"></h3>
            <p id="pay-bit-text"></p>
            <div class="bit-row">
              <span class="bit-num js-bit-number" dir="ltr"></span>
              <button type="button" class="btn btn-small js-copy-bit" data-t="bitCopy"></button>
            </div>
          </div>
          <p id="pay-cash" class="pay-box" hidden></p>
          <p class="reminder" data-t="homeReminder"></p>
          <a id="wa-order-btn" class="btn btn-wa btn-big btn-block" target="_blank" rel="noopener" href="#">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>
            <span data-t="waSave"></span>
          </a>
          <p class="hint" data-t="waHint"></p>
          <button type="button" id="new-order" class="btn btn-ghost" data-t="newOrder"></button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div class="footer-brand">
        <div class="logo" dir="ltr" lang="en">
          <img src="assets/logo.svg" alt="" width="34" height="34">
          <span class="logo-name">ICE DROP</span>
        </div>
        <p data-t="footerTag"></p>
      </div>
      <div class="footer-contact-wrap">
        <p class="footer-contact" data-t="footerContact"></p>
        <a class="btn btn-wa js-wa-contact" target="_blank" rel="noopener" href="#">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>
          <span class="js-wa-number" dir="ltr"></span>
        </a>
      </div>
      <p class="footer-small">© <span id="year"></span> <span dir="ltr" lang="en">Ice Drop</span> · <span data-t="footerMade"></span></p>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/config.js"></script>
  <script src="js/texts.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
